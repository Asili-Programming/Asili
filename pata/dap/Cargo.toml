[package]
name = "pata-dap"
version = "0.2.0"
license = "GPL-2.0-only"
edition = "2021"

[lib]
name = "pata_dap"
path = "src/lib.rs"

[[bin]]
name = "pata-dap"
path = "src/main.rs"

[dependencies]
dap = "=0.4.1-alpha1"
serde_json = "1"
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
asili-evaluator = { path = "../../core/evaluator" }
