[package]
name = "asili-runner"
version = "0.2.2"
license = "Apache-2.0"
edition = "2021"
description = "Standalone runner for Asili .asb artifacts (no compiler)"

[[bin]]
name = "tenda"
path = "src/main.rs"

[dependencies]
asili-trace = { path = "../../core/trace" }
asili-evaluator = { path = "../../core/evaluator", default-features = false }
asili-mem = { path = "mem" }

[features]
default = ["mtandao"]
# Networking builtins (sockets, TLS, HTTP). `--no-default-features` builds the runner for
# programs that use none of them: the network stack is not linked.
mtandao = ["asili-evaluator/mtandao"]

[dev-dependencies]
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
