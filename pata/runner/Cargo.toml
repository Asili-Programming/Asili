[package]
name = "asili-runner"
version = "0.2.2"
license = "Apache-2.0"
edition = "2021"
description = "Standalone runner for Asili .asb artifacts (no compiler)"

[[bin]]
name = "tenda"
path = "src/main.rs"

[dependencies]
asili-trace = { path = "../../core/trace" }
asili-evaluator = { path = "../../core/evaluator", default-features = false }
asili-mem = { path = "mem" }

[features]
default = ["mtandao", "ruwaza"]
# Optional builtin groups; a runner built without one is smaller and runs the programs that use
# none of its builtins (`pata` picks the smallest runner that covers a program, see
# `asili_evaluator::uwezo`). Networking: sockets, TLS, HTTP.
mtandao = ["asili-evaluator/mtandao"]
# Regular expressions (the `ruwaza_*` builtins).
ruwaza = ["asili-evaluator/ruwaza"]

[dev-dependencies]
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
