[package]
name = "pata-lint"
version = "0.2.0"
edition = "2021"

[lib]
name = "pata_lint"
path = "src/lib.rs"

[dependencies]
pata-config = { path = "../config" }
asili-lexer = { path = "../../core/lexer" }
asili-parser = { path = "../../core/parser" }
asili-diagnostics = { path = "../../core/diagnostics" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
