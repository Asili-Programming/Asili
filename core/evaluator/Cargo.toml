[package]
name = "asili-evaluator"
version = "0.5.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
asili-trace = { path = "../trace" }
asili-diagnostics = { path = "../diagnostics" }
rand = "0.10"
asili-parser = { path = "../parser" }
bincode = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-segmentation = "1.11"
stacker = "0.1.24"
wasm-bindgen = { version = "0.2", optional = true }
num-bigint = "0.4"
bigdecimal = "0.4"
num-traits = "0.2"
parking_lot = "0.12"
lock_api = "0.4"
foldhash = "0.2"
# `ruwaza` (regular expressions) and `usimbaji` (hashes and base64): pure Rust, on every target.
regex = "1"
# `njia` channels: blocking and async receive (a `sawia` task waits without blocking its thread).
flume = "0.11"
sha2 = "0.11"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
libc = "0.2"

# TLS is a native-listener-only capability (mkondo_sikiliza/mkondo_tumikia are already fully
# gated out on wasm32 — no raw sockets in a browser), so rustls (and its crypto backend, which
# doesn't cross-compile cleanly to wasm32-unknown-unknown) is scoped to non-wasm32 targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `sawia`/`subiri` (src/kazi_sawia.rs): each task a coroutine with its own stack (corosensei),
# driven by one single-threaded tokio runtime per thread, which also does the waiting (timers,
# channels, sockets).
corosensei = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
# Sockets, TLS and DNS for every network builtin.
asili-mtandao = { path = "../mtandao", optional = true }
# A channel as a streamed HTTP body.
futures-core = { version = "0.3", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
# The HTTP client (`http_ombi`): `builtins/http_mteja.rs` follows redirects, retries and keeps
# cookies (so they stay opt-in); `url` resolves `Location`, `cookie_store` keeps the jar,
# `encoding_rs` decodes a body in its declared charset.
url = { version = "2", optional = true }
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order"], optional = true }
encoding_rs = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand` 0.10 pulls in getrandom 0.4, which needs this explicitly enabled to build for
# wasm32-unknown-unknown (browser) — it calls into `crypto.getRandomValues` via wasm-bindgen's
# JS glue. A no-op for wasm32-wasip1/wasi targets, which already have native WASI random support.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
asili-lexer = { path = "../lexer" }
rcgen = "0.13"
rustls-pki-types = "1"

[features]
default = ["mtandao"]
# Networking: sockets, TLS, DNS and HTTP (the `mkondo_*`, `http_*` and `ws_*` builtins). Without it
# (a runner for programs that use none of them) those builtins are stubs that fail with a message,
# as in the browser, and their crates are not linked. See build.rs (the `net` cfg).
mtandao = [
  "dep:asili-mtandao",
  "dep:futures-core",
  "dep:rustls",
  "dep:rustls-pemfile",
  "dep:url",
  "dep:cookie_store",
  "dep:encoding_rs",
]
# Browser wasm32 target: route I/O builtins (chapisha, onyo, makosa) to `console.log`/`console.error`
# via wasm-bindgen instead of the default silent no-op, and load native code (a wasm module) through
# the page. Mutually meaningful only on wasm32; a
# no-op on other targets since the platform module gates on target_arch too.
wasm-browser = ["dep:wasm-bindgen"]

[lib]
path = "src/lib.rs"
